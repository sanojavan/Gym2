<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر تمرین">
<meta name="theme-color" content="#0C1118">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230C1118'/%3E%3Ccircle cx='90' cy='90' r='58' fill='%23F7C52B'/%3E%3Ccircle cx='90' cy='90' r='17' fill='%230C1118'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<title>دفتر تمرین</title>
<style>
:root{
  --bg:#0C1118;--panel:#131B26;--raise:#1A2431;--deep:#0F1620;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --ink:#EEF1F5;--mut:#8B96A7;--dim:#5B6677;
  --A:#2A8BEA;--B:#F7C52B;--C:#EE4B3A;--G:#19B36B;--gold:#F7C52B;
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:Vazirmatn,system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color:var(--ink);line-height:1.7;min-height:100vh;
  padding:max(14px,env(safe-area-inset-top)) 14px calc(100px + var(--sb));
  background:var(--bg);
  background-image:
    radial-gradient(900px 520px at 108% -10%,rgba(42,139,234,.17),transparent 62%),
    radial-gradient(700px 460px at -18% 110%,rgba(238,75,58,.11),transparent 60%);
}
input,button,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
.disp{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;letter-spacing:0}
bdi.n{unicode-bidi:isolate;direction:ltr}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.hi{font-size:12.5px;color:var(--mut)}
.ttl{font-family:Lalezar,Vazirmatn,sans-serif;font-size:30px;line-height:1.15}
.sv{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03);white-space:nowrap}
.sv i{width:7px;height:7px;border-radius:50%;background:var(--G);box-shadow:0 0 8px var(--G)}
.sv.off i{background:var(--C);box-shadow:0 0 8px var(--C)}

/* hero rack */
.rack{position:relative;border-radius:22px;padding:14px 14px 16px;overflow:hidden;
  background:linear-gradient(180deg,#19222F 0%,#111822 100%);
  border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 40px -24px rgba(0,0,0,.7)}
.rack::before{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(247,197,43,.75),transparent)}
.bb{display:block;width:100%;height:auto}
.bb .pl{transform-box:fill-box}
.bb.go .pl{animation:load .6s cubic-bezier(.2,.9,.25,1.15) both;animation-delay:var(--d)}
@keyframes load{from{transform:translateX(var(--dx));opacity:0}to{transform:none;opacity:1}}
.tons{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:2px}
.tons b{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:58px;line-height:1}
.tons span{font-size:15px;color:var(--mut)}
.pride{text-align:center;font-size:12px;color:var(--mut);margin-top:4px}
.nxt{margin:14px 4px 0;display:grid;gap:6px}
.nxt div{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut)}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 0 0 auto;border-radius:6px;background:linear-gradient(270deg,#F7C52B,#FFE38A)}

/* today */
.today{margin-top:14px;border-radius:18px;padding:16px;background:var(--panel);border:1px solid var(--line)}
.tdh{display:flex;gap:14px;align-items:center}
.pb{--c:var(--A);flex:none;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.32),transparent 46%),var(--c);
  box-shadow:inset 0 0 0 5px rgba(0,0,0,.2),inset 0 0 0 13px rgba(255,255,255,.06),0 12px 26px -12px var(--c)}
.pb b{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:32px;color:#0C1118;line-height:1;margin-top:4px}
.tdt strong{display:block;font-size:17px;font-weight:800}
.tdt span{display:block;font-size:12.5px;color:var(--mut)}
.btn{display:block;width:100%;height:52px;border-radius:14px;border:none;font-weight:800;font-size:15.5px;
  color:#0C1118;background:var(--c,var(--gold));box-shadow:0 14px 28px -14px var(--c,var(--gold));margin-top:14px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.gh{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line2);box-shadow:none}

/* stats strip */
.strip{margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.strip div{padding:12px 4px 10px;text-align:center;border-inline-start:1px solid var(--line)}
.strip div:first-child{border-inline-start:none}
.strip b{display:block;font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:25px;line-height:1.2}
.strip span{font-size:11px;color:var(--mut)}
.strip svg{width:14px;height:14px;vertical-align:-2px;color:var(--C)}

/* sections */
.sec{margin-top:26px}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.sech h2{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:21px;line-height:1.3}
.sech span{font-size:11.5px;color:var(--mut)}
.desc{font-size:12px;color:var(--mut);margin-bottom:12px;line-height:1.9}
.card{border-radius:16px;background:var(--panel);border:1px solid var(--line);overflow:hidden}

/* growth */
.gr{display:grid;grid-template-columns:30px 1fr 64px;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.gr:last-child{border-bottom:none}
.lt{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:Lalezar,Vazirmatn,sans-serif;font-size:16px;color:#0C1118;padding-top:3px}
.gr .bar{height:8px}
.gr em{font-style:normal;font-size:13px;font-weight:800;text-align:left}
.gr small{display:block;font-size:10.5px;color:var(--mut);margin-top:3px}

/* badges */
.bdg{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.bdg::-webkit-scrollbar{display:none}
.md{flex:none;width:74px;text-align:center;background:none;border:none}
.md i{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 6px;border-radius:50%;
  background:#18212D;border:1.5px dashed rgba(255,255,255,.14);color:var(--dim)}
.md.ok i{border:none;color:#3B2A00;background:radial-gradient(circle at 34% 28%,#FFF3C4,transparent 42%),linear-gradient(145deg,#FFE38A,#F7C52B 55%,#C99400);
  box-shadow:inset 0 0 0 5px rgba(0,0,0,.12),0 10px 22px -10px rgba(247,197,43,.8)}
.md i svg{width:22px;height:22px}
.md span{display:block;font-size:11px;line-height:1.5;color:var(--mut)}
.md.ok span{color:var(--ink)}
.ins{margin-top:14px;padding:14px 16px;border-radius:16px;font-size:13px;line-height:1.95;color:#C9D1DC;
  background:linear-gradient(135deg,rgba(42,139,234,.10),rgba(25,179,107,.06));border:1px solid rgba(42,139,234,.2)}

/* workout */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.days button{--c:var(--A);display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--mut);text-align:right}
.days button i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);font-style:normal;font-family:Lalezar,Vazirmatn,sans-serif;font-size:17px;padding-top:3px}
.days button span{font-size:10.5px;line-height:1.45}
.days button.sel{border-color:var(--c);color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01))}
.days button.sel i{background:var(--c);color:#0C1118}
.days button:disabled{opacity:.3}
.rule{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:14px;margin-bottom:14px;font-size:12.3px;line-height:1.9;color:#C9D1DC;background:rgba(42,139,234,.08);border:1px solid rgba(42,139,234,.22)}
.rule svg{flex:none;width:18px;height:18px;color:var(--A);margin-top:3px}
.live{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;margin-bottom:14px;background:rgba(25,179,107,.09);border:1px solid rgba(25,179,107,.3);font-size:12.5px}
.live b{color:#8FE5BD}
.live small{display:block;color:var(--mut);font-size:11px}

.ex{border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
.ex.fc{box-shadow:inset -3px 0 0 var(--B)}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 15px 0}
.exh strong{font-size:15px;font-weight:800;line-height:1.5}
.exh .fct{display:inline-block;font-size:10px;font-weight:700;color:var(--B);border:1px solid rgba(247,197,43,.35);border-radius:999px;padding:0 7px;margin-inline-start:6px;vertical-align:2px}
.mt{display:flex;gap:5px;flex:none}
.mt span{font-size:11px;color:var(--mut);border:1px solid var(--line);padding:1px 8px;border-radius:999px;white-space:nowrap}
.sug{display:block;width:calc(100% - 30px);margin:10px 15px 0;padding:9px 12px;border-radius:11px;text-align:right;font-size:12.5px;line-height:1.85;color:#AFB9C7;background:rgba(255,255,255,.025);border:1px solid var(--line)}
.sug b{color:var(--ink)}
.sug.up{color:#86DDB3;background:rgba(25,179,107,.08);border-color:rgba(25,179,107,.32)}
.sug.up b{color:#B4F0D2}
.sug.down,.sug.warn{color:#EFD38A;background:rgba(247,197,43,.06);border-color:rgba(247,197,43,.3)}
.sug small{display:block;font-size:10.5px;color:var(--dim)}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding:10px 15px 0}
.tl{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#C4CCD7;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-decoration:none}
.tl svg{width:14px;height:14px}
.tl.on{color:var(--ink);background:rgba(255,255,255,.09);border-color:var(--line2)}
.tl.has{color:#EFD38A;border-color:rgba(247,197,43,.35)}
.pn{margin:10px 15px 0;border-radius:12px;background:var(--deep);border:1px solid var(--line);overflow:hidden}
.pn .an{display:block;width:100%;aspect-ratio:3/2}
.pn .an svg{display:block;width:100%;height:100%}
.pn p{padding:12px 13px;font-size:12.8px;line-height:1.95;color:#C8D0DB}
.nts{margin:10px 15px 0;display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:11.5px;color:var(--mut)}
.nts span{padding:1px 8px;border-radius:999px;background:rgba(247,197,43,.08);border:1px solid rgba(247,197,43,.25);color:#EFD38A}
.sets{padding:12px 15px 15px;display:grid;gap:8px}
.shd,.row{display:grid;grid-template-columns:22px 1fr 1fr 66px;gap:8px;align-items:center}
.shd{font-size:10.5px;color:var(--dim);text-align:center}
.row .i,.done .i{font-size:12px;color:var(--mut);text-align:center}
.row input{width:100%;height:46px;border-radius:11px;border:1px solid var(--line2);background:var(--deep);color:var(--ink);text-align:center;font-size:16px;outline:none;direction:ltr}
.row input::placeholder{color:#4C5767}
.row input:focus{border-color:rgba(247,197,43,.6)}
.go{height:46px;border-radius:11px;border:1px solid var(--line2);background:var(--raise);font-weight:800;font-size:13px}
.go:active{transform:scale(.97)}
.done{display:grid;grid-template-columns:22px 1fr auto auto 30px;gap:8px;align-items:center;min-height:46px;padding:0 6px 0 10px;border-radius:11px;background:rgba(25,179,107,.07);border:1px solid rgba(25,179,107,.22)}
.done .v{font-size:15px;font-weight:800;direction:ltr;text-align:right}
.done .v small{font-size:10.5px;font-weight:500;color:var(--mut);margin-left:6px}
.done .t{font-size:10.5px;color:var(--mut)}
.done .x{width:30px;height:30px;border:none;background:none;color:var(--dim);display:grid;place-items:center}
.done .x svg{width:14px;height:14px}
.done.pr{background:linear-gradient(270deg,rgba(247,197,43,.16),rgba(247,197,43,.04));border-color:rgba(247,197,43,.5)}
.rc{font-size:10.5px;padding:0 7px;border-radius:999px;color:#9FE0C0;border:1px solid rgba(25,179,107,.35);white-space:nowrap}
.done.pr .rc{color:#F7D774;border-color:rgba(247,197,43,.45)}
.prt{color:var(--gold);display:inline-flex}
.prt svg{width:15px;height:15px}
.cardio{padding:14px 15px;display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;font-size:13.5px;font-weight:700}
.cardio small{display:block;font-size:11px;font-weight:400;color:var(--mut)}
.cardio input{height:46px;border-radius:11px;border:1px solid var(--line2);background:var(--deep);text-align:center;font-size:16px;outline:none;direction:ltr;width:100%}

/* progress */
.st{display:grid;grid-template-columns:1fr 86px 76px;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:none}
.st .nm{font-size:13px;line-height:1.5}
.st .nm small{display:block;font-size:10.5px;color:var(--mut)}
.st svg{display:block;width:86px;height:28px}
.st .dv{text-align:left;font-size:12.5px;font-weight:800}
.st .dv small{display:block;font-size:10.5px;font-weight:500;color:var(--mut)}
.grp{padding:8px 14px;font-size:11.5px;font-weight:700;color:var(--mut);background:rgba(255,255,255,.02);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.grp i{width:9px;height:9px;border-radius:50%}
.mr{display:grid;grid-template-columns:84px 1fr 62px;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.mr:last-child{border-bottom:none}
.mt2{height:9px;border-radius:9px;background:rgba(255,255,255,.06);position:relative}
.mt2 i{position:absolute;top:0;bottom:0;right:0;border-radius:9px}
.mt2 u{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.35);border-radius:2px}
.mr em{font-style:normal;text-align:left;font-weight:700}
.mr em small{display:block;font-size:10px;font-weight:500;color:var(--mut)}
.fq{display:inline-flex;gap:3px;margin-inline-start:4px;vertical-align:1px}
.fq b{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15)}
.fq b.on{background:var(--G)}
.lw{display:flex;align-items:flex-end;gap:8px;height:120px;padding:14px 14px 0}
.lw div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.lw i{width:100%;max-width:30px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#5AA8F2,var(--A))}
.lw div.cur i{background:linear-gradient(180deg,#FFE38A,var(--gold))}
.lw span{font-size:10px;color:var(--mut)}
.msg{padding:12px 14px;font-size:12.5px;line-height:1.9;color:#C9D1DC;border-top:1px solid var(--line)}
.tgr{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
.tgr:last-child{border-bottom:none}
.tgr small{display:block;font-size:11px;color:var(--mut)}
.tgr b{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:20px}
.empty{padding:22px 16px;text-align:center;font-size:12.5px;line-height:1.9;color:var(--mut)}
.hs{border-bottom:1px solid var(--line)}
.hs:last-child{border-bottom:none}
.hsh{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 14px;background:none;border:none;text-align:right}
.hsh strong{display:block;font-size:13.5px}
.hsh small{display:block;font-size:11px;color:var(--mut)}
.hsh em{font-style:normal;font-size:12px;text-align:left;color:var(--mut)}
.hsb{padding:0 14px 12px;display:grid;gap:5px}
.hsb div{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#B9C2CE}
.hsb div span:last-child{direction:ltr;white-space:nowrap;font-size:11.5px}
.hsb p{font-size:11.5px;color:#EFD38A}

/* weight */
.ana{padding:16px}
.ana b{display:block;font-size:17px;font-weight:800;margin:4px 0 6px}
.ana p{font-size:13px;line-height:1.9;color:#C9D1DC}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.g2 label{display:block;font-size:11px;color:var(--mut);margin-bottom:5px}
.g2 input{width:100%;height:46px;border-radius:11px;border:1px solid var(--line2);background:var(--deep);text-align:center;font-size:16px;outline:none;direction:ltr}
.wl{display:flex;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--line);font-size:12.5px}
.wl span:first-child{color:var(--mut)}
.wl span:last-child{direction:ltr;font-weight:700}
.chart{padding:12px 10px 4px}
.chart svg{display:block;width:100%;height:auto}
textarea{width:100%;background:var(--deep);border:1px solid var(--line2);border-radius:11px;color:var(--mut);font-size:10.5px;padding:10px;direction:ltr;font-family:monospace;resize:vertical;outline:none}

/* timer */
#timer{position:fixed;left:12px;right:12px;bottom:calc(76px + var(--sb));z-index:25;max-width:616px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;
  background:rgba(19,27,38,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line2);box-shadow:0 18px 40px -14px rgba(0,0,0,.75)}
#timer[hidden]{display:none}
#timer .rg{flex:none;width:46px;height:46px}
#timer .rg circle{fill:none;stroke-width:4}
#timer .trk{stroke:rgba(255,255,255,.1)}
#timer .prg{stroke:var(--gold);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .25s linear}
#timer .tx{flex:1;min-width:0}
#timer .tx b{display:block;font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:24px;line-height:1.1}
#timer .tx span{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer button{flex:none;height:40px;padding:0 13px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.05);font-size:12.5px;font-weight:700}
#timer.done{border-color:rgba(25,179,107,.7)}
#timer.done .prg{stroke:var(--G)}
#timer.done .tx b{color:#8FE5BD}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;padding-bottom:var(--sb);
  background:rgba(12,17,24,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;background:none;border:none;color:var(--dim);font-size:10.5px}
nav button svg{width:22px;height:22px}
nav button.sel{color:var(--ink)}
nav button.sel svg{color:var(--gold)}
nav button.sel::before{content:"";position:absolute;top:-1px;width:22px;height:2px;border-radius:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50}
#sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(5,8,12,.62)}
.sh{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:90vh;overflow:auto;
  padding:10px 18px calc(20px + var(--sb));border-radius:24px 24px 0 0;background:#141C27;border:1px solid var(--line2);border-bottom:none;animation:up .3s cubic-bezier(.2,.9,.2,1)}
.sh::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:0 auto 16px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sht{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:23px;line-height:1.35}
.shs{font-size:13px;color:var(--mut);margin-top:4px;line-height:1.9}
.prb{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:800;color:#3B2A00;background:linear-gradient(135deg,#FFE38A,#F7C52B 60%,#D9A300);box-shadow:0 8px 22px -8px rgba(247,197,43,.9)}
.prb svg{width:15px;height:15px}
.rg4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 12px}
.rg4 button,.rg5 button{border-radius:15px;border:1px solid var(--line2);background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rg4 button{height:82px}
.rg4 b,.rg5 b{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:30px;line-height:1}
.rg4 span{font-size:11px;color:var(--mut)}
.rg4 button:active,.rg5 button:active{transform:scale(.96);border-color:var(--gold)}
.rg5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0 6px}
.rg5 button{height:62px}
.rg5 b{font-size:24px}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:10px}
.lnk{display:block;margin:6px auto 0;background:none;border:none;color:var(--mut);font-size:12.5px;padding:8px 14px}
.tgs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 12px}
.tgs button{padding:9px 13px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-size:12.5px;color:#C4CCD7}
.tgs button.on{color:#3B2A00;font-weight:700;background:var(--gold);border-color:var(--gold)}
#notetx{height:84px;font-family:Vazirmatn,system-ui,sans-serif;font-size:13.5px;color:var(--ink);direction:rtl}
.sum{margin-top:16px;text-align:center}
.sum .big{font-family:Lalezar,Vazirmatn,sans-serif;font-size:52px;line-height:1.1}
.sum .big small{font-family:Vazirmatn,sans-serif;font-size:14px;color:var(--mut)}
.dl{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:800}
.dl.p{color:#8FE5BD;background:rgba(25,179,107,.12)}
.dl.z{color:var(--mut);background:rgba(255,255,255,.05)}
.sg3{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0;border-radius:14px;border:1px solid var(--line);background:var(--deep)}
.sg3 div{padding:11px 4px;text-align:center;border-inline-start:1px solid var(--line)}
.sg3 div:first-child{border-inline-start:none}
.sg3 b{display:block;font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:21px}
.sg3 span{font-size:11px;color:var(--mut)}
.prl{display:grid;gap:6px;margin-bottom:14px}
.prl div{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:11px;font-size:12.5px;background:rgba(247,197,43,.08);border:1px solid rgba(247,197,43,.28)}
.prl div span:last-child{direction:ltr;font-weight:700;color:#F7D774}
.quote{font-size:13.5px;line-height:1.95;color:#DCE2EA;text-align:center;padding:0 6px}

#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;max-width:90vw;padding:9px 18px;border-radius:999px;font-size:12.5px;background:#1E2835;border:1px solid var(--line2);box-shadow:0 10px 30px -10px rgba(0,0,0,.7);display:none;text-align:center}
#fx{position:fixed;inset:0;z-index:70;pointer-events:none;display:none;width:100%;height:100%}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.strip b{font-size:21px}.tons b{font-size:48px}.shd,.row{grid-template-columns:20px 1fr 1fr 58px}}

  const d=dirOf(p1,p2),b=Math.atan2(d[1],d[0]);

/* ---------- renderer ---------- */
function easeIO(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}
function animPhase(S,t){
  if(S.hold)return 0;
  if(S.walk)return (1-Math.cos(2*Math.PI*t))/2;
  if(t<.3)return easeIO(t/.3);
  if(t<.4)return 1;
  if(t<.9)return 1-easeIO((t-.4)/.5);
  return 0;
}
function lerpPose(A,B,e){const o={};new Set([...Object.keys(A),...Object.keys(B)]).forEach(k=>{const a=A[k],b=B[k];o[k]=(typeof a==='number'&&typeof b==='number')?a+(b-a)*e:(a!==undefined?a:b);});return o;}
function buildFig(S,P){const F=S.v==='f'?frontFig(P):sideFig(P);if(S.oneArm)F.oneArm=1;return F;}
function traceOf(S){
  if(S._tr||!S.tr)return S._tr;
  const pts=[];for(let i=0;i<=16;i++){const F=buildFig(S,lerpPose(S.A,S.B,i/16));pts.push(F.J[S.tr]);}
  S._tr=pts;return pts;
}
function renderAnim(id,t,acc){
  const S=ANIM[id];if(!S)return '';
  const e=animPhase(S,t);
  let P=lerpPose(S.A,S.B,e);
  if(S.walk)P=Object.assign({},P,{y:P.y-2.4*Math.sin(Math.PI*e)});
  const F=buildFig(S,P);
  let o='<svg viewBox="'+(S.vb||'0 0 240 160')+'" xmlns="http://www.w3.org/2000/svg" role="img">';
  if(!S.vb)o+=floorE(S.sh[0],S.sh[1]);
  if(S.bg)o+=S.bg(F,e,P);
  o+=S.v==='f'?drawFront(F,S,e,t):drawSide(F,S,e,t);
  const tr=traceOf(S);
  if(tr){o+='<polyline points="'+tr.map(p=>q1(p[0])+','+q1(p[1])).join(' ')+'" fill="none" stroke="'+acc+'" stroke-width="1.4" stroke-dasharray="3 3" opacity=".75"/>';
    o+=circE(tr[0],2.2,acc,' opacity=".9"')+circE(tr[tr.length-1],2.2,acc,' opacity=".9"');}
  if(S.fg)o+=S.fg(F,e,P);
  return o+'</svg>';
}

function idb(){return new Promise((res,rej)=>{
  if(!window.indexedDB)return rej();
  const r=indexedDB.open('gymdb',1);
  r.onupgradeneeded=()=>{try{r.result.createObjectStore('kv');}catch(e){}};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(); r.onblocked=()=>rej();
});}
function idbPut(v){return idb().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,'data');
  tx.oncomplete=()=>{IDB_OK=true;res(1);}; tx.onerror=()=>rej(); tx.onabort=()=>rej();
}));}
function idbGet(){return idb().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction('kv','readonly'), q=tx.objectStore('kv').get('data');
  q.onsuccess=()=>{IDB_OK=true;res(q.result||null);}; q.onerror=()=>rej();
}));}

/* ================= FORMAT ================= */
const FAD='۰۱۲۳۴۵۶۷۸۹';
const fa=n=>(n===null||n===undefined||n==='')?'—':String(n).replace(/\d/g,d=>FAD[d]).replace(/\./g,'٫');
const faN=(n,dg)=>{try{return (+n).toLocaleString('fa-IR',{maximumFractionDigits:dg||0,minimumFractionDigits:0});}catch(e){return fa(Math.round(n));}};
const sg=(n,dg,suf)=>'<bdi class="n">'+(n>0.0001?'+':n<-0.0001?'−':'')+faN(Math.abs(n),dg||0)+(suf||'')+'</bdi>';
const nowISO=()=>new Date().toISOString();
const faD=i=>{try{return new Intl.DateTimeFormat('fa-IR',{day:'numeric',month:'long'}).format(new Date(i));}catch(e){return String(i).slice(0,10);}};
const faT=i=>{try{return new Date(i).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toEn=v=>String(v||'').replace(/[۰-۹]/g,d=>FAD.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,،\/]/g,'.').replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1');
const unitOf=ex=>ex.mode==='carry'?'متر':ex.mode==='hold'?'ثانیه':ex.mode==='time'?'ثانیه':'تکرار';

/* ================= CALCULATIONS ================= */
const isW=ex=>!!ex&&!ex.mode;
function volEntries(en,only){let v=0;for(const id in en){if(only&&!only.has(id))continue;if(!isW(EXI[id]))continue;en[id].forEach(s=>v+=(+s.w||0)*(+s.r||0));}return v;}
const e1=(w,r)=>(w>0&&r>0)?w*(1+r/30):0;
function perf(ex,s){if(!ex)return 0;if(ex.mode==='carry'||ex.mode==='hold')return (+s.w||0)*(+s.r||0);if(ex.mode==='time')return +s.r||0;return e1(+s.w,+s.r);}
function bestSets(ex,sets){let b=0;(sets||[]).forEach(s=>{const v=perf(ex,s);if(v>b)b=v;});return b;}
function bestBefore(id,n){let b=0;const ex=EXI[id];for(let i=0;i<n&&i<D.logs.length;i++){const en=D.logs[i].entries[id];if(en){const v=bestSets(ex,en);if(v>b)b=v;}}return b;}
function prsOf(idx){const l=D.logs[idx],out=[];for(const id in l.entries){const ex=EXI[id];if(!ex||ex.mode==='time')continue;const v=bestSets(ex,l.entries[id]),pb=bestBefore(id,idx);if(pb>0&&v>pb+1e-6)out.push({id,v,pb});}return out;}
function prCount(){let n=0;D.logs.forEach((l,i)=>n+=prsOf(i).length);return n;}
function lastWith(id){for(let i=D.logs.length-1;i>=0;i--)if(D.logs[i].entries[id])return D.logs[i];return null;}
function lastOfDay(d){for(let i=D.logs.length-1;i>=0;i--)if(D.logs[i].day===d)return i;return -1;}
function nextDay(){if(D.active)return D.active.day;if(!D.logs.length)return 'A';return ORDER[(ORDER.indexOf(D.logs[D.logs.length-1].day)+1)%3];}
function wkStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+1)%7));return x;}
function wkKey(d){const x=wkStart(d);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();}
const lStart=l=>l.start||l.date;
function weekList(){
  if(!D.logs.length)return [];
  const out=[]; const now=wkStart(new Date());
  for(let d=wkStart(lStart(D.logs[0]));d<=now;d.setDate(d.getDate()+7))out.push(wkKey(d));
  return out;
}
function streaks(){
  const m={};D.logs.forEach(l=>{const k=wkKey(lStart(l));m[k]=(m[k]||0)+1;});
  const arr=weekList().map(k=>m[k]||0);
  let best=0,run=0;arr.forEach(c=>{if(c>=2){run++;if(run>best)best=run;}else run=0;});
  let cur=0,i=arr.length-1;if(i>=0&&arr[i]<2)i--;for(;i>=0&&arr[i]>=2;i--)cur++;
  return {cur,best};
}
function dayGrowth(dy){
  const ls=D.logs.filter(l=>l.day===dy);if(ls.length<2)return null;
  const a=ls[0],b=ls[ls.length-1];
  const ov=new Set(Object.keys(a.entries).filter(id=>b.entries[id]&&isW(EXI[id])));
  const v1=volEntries(a.entries,ov),v2=volEntries(b.entries,ov);
  if(v1<=0)return null;return {pct:(v2/v1-1)*100,v1,v2,n:ls.length};
}
function compareSession(idx){
  const l=D.logs[idx];let p=null;
  for(let i=idx-1;i>=0;i--)if(D.logs[i].day===l.day){p=D.logs[i];break;}
  if(!p)return null;
  const ov=new Set(Object.keys(l.entries).filter(id=>p.entries[id]&&isW(EXI[id])));
  const v1=volEntries(p.entries,ov),v2=volEntries(l.entries,ov);
  if(v1<=0)return null;return {pct:(v2/v1-1)*100,v1,v2};
}
function durMin(l){
  const t=[];for(const id in l.entries)l.entries[id].forEach(s=>{const x=new Date(s.at).getTime();if(!isNaN(x))t.push(x);});
  if(!t.length)return 0;
  const st=new Date(lStart(l)).getTime();
  return Math.max(1,Math.round((Math.max(...t)-st)/60000+(+l.cardio||0)));
}
function muscleWeek(key){
  const sets={},freq={};Object.keys(MU).forEach(k=>{sets[k]=0;freq[k]=0;});
  const ss=D.logs.filter(l=>wkKey(lStart(l))===key);
  if(D.active&&wkKey(D.active.start)===key)ss.push(D.active);
  ss.forEach(l=>{const hit=new Set();
    for(const id in l.entries){const ex=EXI[id];if(!ex||!ex.mu)continue;
      const n=l.entries[id].filter(s=>+s.r>0).length;
      ex.mu.p.forEach(m=>{sets[m]+=n;if(n)hit.add(m);});
      (ex.mu.s||[]).forEach(m=>{sets[m]+=n*.5;});}
    hit.forEach(m=>freq[m]++);});
  return {sets,freq,n:ss.length};
}
function loadByWeek(){const m={};D.logs.forEach(l=>{if(!l.rpe)return;const k=wkKey(lStart(l));m[k]=(m[k]||0)+l.rpe*durMin(l);});return m;}
function tagStats(){
  const c={},by={};
  D.logs.forEach(l=>{if(!l.notes)return;for(const id in l.notes)(l.notes[id].tags||[]).forEach(t=>{c[t]=(c[t]||0)+1;by[t]=by[t]||{};by[t][id]=(by[t][id]||0)+1;});});
  return Object.keys(c).sort((a,b)=>c[b]-c[a]).map(t=>{const top=Object.keys(by[t]).sort((a,b)=>by[t][b]-by[t][a])[0];return {t,n:c[t],top};});
}
function stats(){
  const tons=D.logs.reduce((a,l)=>a+volEntries(l.entries),0)/1000;
  const st=streaks();const dc={A:0,B:0,C:0};D.logs.forEach(l=>dc[l.day]=(dc[l.day]||0)+1);
  const W=D.weights;const wd=W.length>=2?W[W.length-1].weight-W[0].weight:null;
  const g={A:dayGrowth('A'),B:dayGrowth('B'),C:dayGrowth('C')};
  const gv=ORDER.map(k=>g[k]).filter(Boolean).map(x=>x.pct);
  return {tons,prs:prCount(),sessions:D.logs.length,streak:st.cur,bestStreak:st.best,dayCount:dc,wd,g,gAvg:gv.length?gv.reduce((a,b)=>a+b,0)/gv.length:null};
}

/* ================= SUGGESTION ENGINE ================= */
const roundTo=(w,inc)=>Math.max(0,Math.round(w/inc)*inc);
function lighter(w,inc){return Math.max(0,Math.min(roundTo(w*.9,inc),w-inc));}
function suggest(ex){
  const L=lastWith(ex.id), u=unitOf(ex);
  if(!L)return {first:1,msg:'اولین بار است — وزنه‌ای بردار که با فرم کامل به سقف بازه برسی.'};
  const sets=(L.entries[ex.id]||[]).filter(s=>+s.r>0);
  if(!sets.length)return {first:1,msg:'دفعه قبل ثبت نشد — از وزنه راحت شروع کن.'};
  const tg=new Set(((L.notes&&L.notes[ex.id])||{}).tags||[]);
  const w=Math.max(...sets.map(s=>+s.w||0)), reps=sets.map(s=>+s.r);
  const rirs=sets.filter(s=>s.rir!==undefined&&s.rir!==null).map(s=>+s.rir);
  const avgR=rirs.length?rirs.reduce((a,b)=>a+b,0)/rirs.length:null;
  const full=sets.length>=ex.sets, allTop=full&&reps.every(r=>r>=ex.max), anyLow=reps.some(r=>r<ex.min);
  const easy=tg.has('خیلی راحت بود')||(avgR!==null&&avgR>=3);
  let o;
  if(tg.has('درد مفصل'))o={lv:'warn',w:lighter(w,ex.inc),r:ex.min,msg:'دفعه قبل درد ثبت شد — سبک‌تر شروع کن و اگر درد برگشت، این حرکت را کنار بگذار.'};
  else if(tg.has('فرم خراب شد'))o={lv:'hold',w,r:ex.min,msg:'دفعه قبل فرم خراب شد — همین وزنه، این بار با فرم کامل.'};
  else if(allTop)o={lv:'up',w:w+(easy?2:1)*ex.inc,r:ex.min,msg:easy?'سقف بازه را زدی و هنوز جا داشتی — دو پله سنگین‌تر.':'سقف بازه را زدی — یک پله سنگین‌تر.'};
  else if(anyLow){const lr=sets[sets.length-1].rir;
    const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
    let prevLow=false;const pi=D.logs.lastIndexOf(L);
    for(let i=pi-1;i>=0;i--){const ps=(D.logs[i].entries[ex.id]||[]).filter(s=>+s.r>0);if(ps.length){prevLow=avg(ps.map(s=>+s.r))<ex.min-1;break;}}
    const stuck=prevLow&&avg(reps)<ex.min-1;
    if(stuck){const ok=sets.filter(s=>+s.r>=ex.min).map(s=>+s.w||0);const inR=ok.length?Math.max(...ok):0;
      o={lv:'down',w:(inR>0&&inR<w)?inR:lighter(w,ex.inc),r:ex.min,msg:'دو جلسه پشت سر هم زیر بازه ماندی — سبک‌تر کن تا داخل بازه کار کنی؛ رشد از همین‌جا شروع می‌شود.'};}
    else if(lr===0||(avgR!==null&&avgR<1))o={lv:'down',w:lighter(w,ex.inc),r:ex.min,msg:'به کف بازه نرسیدی و ذخیره‌ای نماند — کمی سبک‌تر.'};
    else o={lv:'hold',w,r:ex.min,msg:'هنوز به کف بازه نرسیده‌ای — همین وزنه.'};}
  else if(easy)o={lv:'up',w:w+ex.inc,r:ex.min,msg:'داخل بازه بودی ولی راحت — یک پله سنگین‌تر.'};
  else if(ex.mode)o={lv:'same',w,r:ex.max,msg:'همین وزنه؛ هدف این جلسه رسیدن به '+fa(ex.max)+' '+u+' در هر ست.'};
  else o={lv:'same',w,r:Math.min(...reps)+1,msg:'همین وزنه، یک '+u+' بیشتر.'};
  if(tg.has('گریپ کم آورد')&&['b1','b2','b3'].includes(ex.id))o.msg+=' اگر گریپ اجازه نداد، از بند لیفت کمک بگیر تا پشت کامل کار کند.';
  return o;
}

/* ================= WEIGHT ANALYSIS ================= */
function analyzeWeek(){
  const L=D.weights;if(!L.length)return null;
  const c=L[L.length-1],p=L[L.length-2];
  if(!p)return {lv:'info',t:'نقطه شروع ثبت شد',m:'از هفته بعد نرخ تغییر محاسبه می‌شود.'};
  if(!(c.weight>0)||!(p.weight>0))return null;
  const d=+(p.weight-c.weight).toFixed(2);
  const l4=L.slice(-4),slow=l4.length===4&&l4.slice(1).every((x,i)=>l4[i].weight-x.weight<.3);
  const wc=(c.waist&&p.waist)?+(p.waist-c.waist).toFixed(1):null;
  if(c.energy&&p.energy&&c.energy<5&&p.energy<5)return {lv:'warn',t:'دو هفته انرژی پایین',m:'یک هفته سبک بگیر: ست‌ها نصف، وزنه‌ها ثابت. خواب و پروتئین را جدی بگیر.'};
  if(d>1.2)return {lv:'bad',t:faN(d,1)+' کیلو در هفته — خیلی سریع',m:'این نرخ یعنی بخشی از کاهش، عضله است. پروتئین را به ۱۶۰ گرم برسان و کالری را کمی بالا ببر.'};
  if(d>=.5)return {lv:'good',t:faN(d,1)+' کیلو در هفته — ایده‌آل',m:'دقیقاً در بازه‌ای هستی که عضله حفظ می‌شود. تغییری نده.'};
  if(d>=.3)return {lv:'good',t:faN(d,1)+' کیلو در هفته — آرام و درست',m:wc&&wc>0?'دور کمر هم '+faN(wc,1)+' سانت کم شده. عالی است.':'روند سالم است.'};
  if(slow)return {lv:'warn',t:'سه هفته توقف ترازو',m:'قدم روزانه را به ۸ هزار برسان یا شام را سبک‌تر کن. اول آب و خواب را چک کن.'};
  if(wc&&wc>0)return {lv:'good',t:'ترازو ثابت، کمر '+faN(wc,1)+' سانت کمتر',m:'این بهترین حالت ممکن است: چربی کم می‌شود و عضله ساخته می‌شود.'};
  if(d>=0)return {lv:'info',t:'تغییر ناچیز',m:'نوسان طبیعی است. دور کمر را کنار وزن ثبت کن تا تصویر کامل شود.'};
  return {lv:'warn',t:faN(Math.abs(d),1)+' کیلو افزایش',m:'کراتین تا ۲ کیلو آب درون عضله نگه می‌دارد و طبیعی است. اگر بیشتر شد، شام و آخر هفته را بررسی کن.'};
}

/* ================= BARBELL (signature) ================= */
function barbell(n,anim){
  const H=[86,78,70,62,54,47,40], CC=['#EE4B3A','#2A8BEA','#F7C52B','#19B36B','#E6E9EE','#EE4B3A','#2A8BEA'];
  let s='<svg class="bb'+(anim?' go':'')+'" viewBox="0 0 360 112" role="img" aria-label="هالتر">';
  s+='<defs><linearGradient id="chr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5F9"/><stop offset=".45" stop-color="#9AA5B5"/><stop offset="1" stop-color="#4F5A6B"/></linearGradient>'+
     '<linearGradient id="shn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>';
  s+='<rect x="112" y="52" width="136" height="7" rx="3" fill="url(#chr)"/>';
  for(let k=0;k<17;k++)s+='<line x1="'+(146+k*4)+'" y1="53" x2="'+(146+k*4)+'" y2="58" stroke="#3E4858" stroke-width="1"/>';
  s+='<rect x="8" y="50" width="104" height="11" rx="4" fill="url(#chr)"/><rect x="248" y="50" width="104" height="11" rx="4" fill="url(#chr)"/>';
  s+='<rect x="104" y="44" width="9" height="23" rx="2" fill="#7D8898"/><rect x="247" y="44" width="9" height="23" rx="2" fill="#7D8898"/>';
  for(let i=0;i<n;i++){
    const h=H[i],y=55.5-h/2,c=CC[i%CC.length];
    const xr=258+i*13, xl=90-i*13;
    [[xr,54],[xl,-54]].forEach(([x,dx])=>{
      s+='<g class="pl" style="--d:'+(120+i*110)+'ms;--dx:'+dx+'px"><rect x="'+x+'" y="'+y+'" width="11" height="'+h+'" rx="3" fill="'+c+'"/>'+
         '<rect x="'+x+'" y="'+y+'" width="11" height="'+h+'" rx="3" fill="url(#shn)"/>'+
         '<rect x="'+(x+3.5)+'" y="'+(y+5)+'" width="4" height="'+(h-10)+'" rx="2" fill="#000" opacity=".14"/></g>';
    });
  }
  if(!n){[[258,1],[90,-1]].forEach(([x])=>{s+='<rect x="'+x+'" y="12.5" width="11" height="86" rx="3" fill="none" stroke="rgba(255,255,255,.18)" stroke-dasharray="4 4"/>';});}
  return s+'</svg>';
}

  const gr=ORDER.filter(k=>S.g[k]);
  if(gr.length){
    const mx=Math.max(30,...gr.map(k=>Math.abs(S.g[k].pct)));

    gr.forEach(k=>{const g=S.g[k];h+='<div class="gr"><span class="lt" style="background:'+COL[k]+'">'+k+'</span><div><div class="bar"><i style="width:'+Math.max(4,Math.min(100,Math.abs(g.pct)/mx*100)).toFixed(0)+'%;background:'+(g.pct>=0?'linear-gradient(270deg,'+COL[k]+',#fff0)':'rgba(255,255,255,.2)')+'"></i></div><small>'+faN(g.v1)+' ← '+faN(g.v2)+' کیلو، '+fa(g.n)+' جلسه</small></div><em>'+sg(g.pct,0,'٪')+'</em></div>';});
    h+='</div></div>';
  }
  h+='<div class="sec"><div class="sech"><h2>مدال‌ها</h2><span>'+fa(BADGES.filter(b=>b.ok(S)).length)+' از '+fa(BADGES.length)+'</span></div><div class="bdg">';
  BADGES.forEach((b,i)=>{h+='<button class="md'+(b.ok(S)?' ok':'')+'" data-act="badge" data-v="'+i+'"><i>'+IC[b.ic]+'</i><span>'+b.n+'</span></button>';});
  h+='</div></div>';

function insight(S){
  const best=ORDER.filter(k=>S.g[k]).sort((a,b)=>S.g[b].pct-S.g[a].pct)[0];
  if(best&&S.g[best].pct>0){const g=S.g[best];return 'جلسه '+best+' از '+faN(g.v1)+' کیلو به '+faN(g.v2)+' کیلو رسیده؛ یعنی هر بار که این جلسه را می‌زنی، '+faN(g.v2-g.v1)+' کیلو بیشتر از روز اول جابه‌جا می‌کنی.';}
  if(S.sessions)return 'هر جلسه‌ای که ثبت می‌شود یک قدم به هدف نزدیک‌تر است. اعداد از جلسه دوم هر نوع شروع به حرف زدن می‌کنند.';
  return 'اولین جلسه را شروع کن. از همان ست اول، همه چیز اینجا ثبت و مقایسه می‌شود.';
}

/* ================= PROGRESS ================= */
function spark(vals,col){
  if(vals.length<2)return '<svg viewBox="0 0 86 28"><circle cx="43" cy="14" r="3" fill="'+col+'"/></svg>';
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[3+i*(80/(vals.length-1)),24-((v-mn)/rg)*20]);
  const l=pts[pts.length-1];
  return '<svg viewBox="0 0 86 28"><polyline points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+l[0].toFixed(1)+'" cy="'+l[1].toFixed(1)+'" r="3" fill="'+col+'"/></svg>';
}

  if(!has)h+='<div class="empty">بعد از بستن هر جلسه یک نمره سختی بده. از جلسه بعد، نمودار بار هفتگی اینجا ساخته می‌شود.</div>';

function lineChart(vals,labels,col,unit){
  if(vals.length<2)return '';
  const mn=Math.min(...vals)-.5,mx=Math.max(...vals)+.5,W=340,H=150,pl=34,pr=10,pt=12,pb=24;
  const X=i=>pl+i*((W-pl-pr)/(vals.length-1)), Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  let s='<svg viewBox="0 0 '+W+' '+H+'">';
  [0,.5,1].forEach(f=>{const v=mn+(mx-mn)*f,y=Y(v);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="rgba(255,255,255,.07)"/><text x="'+(pl-6)+'" y="'+(y+4).toFixed(1)+'" fill="#5B6677" font-size="10" text-anchor="end">'+faN(v,1)+'</text>';});
  s+='<polyline points="'+vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round"/>';
  vals.forEach((v,i)=>{s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.5" fill="'+col+'"/><text x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" fill="#5B6677" font-size="10" text-anchor="middle">'+labels[i]+'</text>';});
  return s+'</svg>';
}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',2200);}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};
let AC=null;
document.addEventListener('pointerdown',()=>{if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}});
function beep(){if(!AC)return;try{AC.resume&&AC.resume();[0,.18].forEach(dl=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=dl?1175:880;const t=AC.currentTime+dl;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.32);});}catch(e){}}
function confetti(){
  if(REDUCED)return;
  const c=document.getElementById('fx'),x=c.getContext('2d'),dpr=window.devicePixelRatio||1;
  const W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr;c.style.display='block';
  const cols=['#EE4B3A','#2A8BEA','#F7C52B','#19B36B','#E6E9EE'],P=[];
  for(let i=0;i<150;i++)P.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.42,vx:(Math.random()-.5)*W*.014,vy:-(Math.random()*H*.013+H*.005),r:(Math.random()*5+4)*dpr,c:cols[i%5],a:Math.random()*6,va:(Math.random()-.5)*.35,k:i%3});
  let t0=0;
  (function f(ts){if(!t0)t0=ts;const dt=ts-t0;x.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=H*.00045;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=Math.max(0,1-dt/1900);x.fillStyle=p.c;
      if(p.k===0){x.beginPath();x.arc(0,0,p.r*.6,0,7);x.fill();}else x.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66);x.restore();});
    if(dt<1900)requestAnimationFrame(f);else c.style.display='none';})(performance.now());
}

let TM=null,TMI=null;
function startTimer(id){const ex=EXI[id];if(!ex)return;const dur=ex.rest||60;TM={end:Date.now()+dur*1000,dur,id,done:false};clearInterval(TMI);TMI=setInterval(tick,250);tick();}
function tick(){
  const el=document.getElementById('timer');
  if(!TM){el.hidden=true;el.classList.remove('done');clearInterval(TMI);return;}
  const left=Math.max(0,(TM.end-Date.now())/1000);el.hidden=false;
  document.getElementById('tmprg').style.strokeDashoffset=(119.38*(1-left/TM.dur)).toFixed(2);
  document.getElementById('tmsec').textContent=left>0?faN(Math.ceil(left))+' ثانیه':'ست بعد';
  document.getElementById('tmlbl').textContent=left>0?'استراحت، '+EXI[TM.id].n:'استراحت تمام شد';
  if(left<=0&&!TM.done){TM.done=true;el.classList.add('done');buzz([220,100,220]);beep();setTimeout(()=>{if(TM&&TM.done){TM=null;tick();}},5000);}
}

let rafOn=false,lastF=0;

  const els=document.querySelectorAll('[data-anim]');
  if(!els.length){rafOn=false;return;}
  if(ts-lastF>40){lastF=ts;els.forEach(el=>{const S=ANIM[el.dataset.anim];const t=S&&S.walk?(ts%1500)/1500:(ts%2900)/2900;el.innerHTML=renderAnim(el.dataset.anim,t,el.dataset.acc);});}

function ensureAnim(){

  els.forEach(el=>{if(!el.innerHTML)el.innerHTML=renderAnim(el.dataset.anim,0,el.dataset.acc);});

/* ================= ACTIONS ================= */
function ensureActive(){if(!D.active)D.active={id:Date.now(),day:DAY,start:nowISO(),entries:{},notes:{},cardio:''};if(!D.active.notes)D.active.notes={};return D.active;}
function saveSet(id,i){
  const ex=EXI[id],dv=(D.drafts[id]&&D.drafts[id][i])||{};
  const r=+dv.r,w=+dv.w||0;
  if(!(r>0)){toast('تعداد '+unitOf(ex)+' را وارد کن');return;}
  if(!(w>0)){toast('وزنه را وارد کن');return;}
  const A=ensureActive();
  const hist=bestBefore(id,D.logs.length);
  const sess=bestSets(ex,(A.entries[id]||[]).filter(s=>s.i!==i));
  const rec={w,r,at:nowISO(),i};
  const isPR=hist>0&&perf(ex,rec)>Math.max(hist,sess)+1e-6;
  if(isPR)rec.pr=1;
  const arr=(A.entries[id]||[]).filter(s=>s.i!==i);arr.push(rec);arr.sort((a,b)=>a.i-b.i);A.entries[id]=arr;
  if(D.drafts[id])D.drafts[id][i]={w:'',r:''};
  const ok=save();buzz(isPR?[40,60,40,60,140]:30);
  render();
  if(!ok)toast('ذخیره نشد — از تب پشتیبان یک کپی بگیر');
  SHEET={type:'rir',id,i};openSheet(sheetRir(id,i,isPR));
  if(isPR)confetti();
}
function setRir(v){
  if(!SHEET||SHEET.type!=='rir')return;
  const A=D.active;if(A&&A.entries[SHEET.id]){const s=A.entries[SHEET.id].find(x=>x.i===SHEET.i);if(s)s.rir=v;save();render();}
  closeSheet();
}
function finish(rpe){
  const A=D.active;if(!A)return;
  const c=document.getElementById('cardio');
  const log=Object.assign({},A,{end:nowISO(),date:A.start,cardio:c?c.value:(A.cardio||''),rpe:rpe||null});
  D.logs.push(log);D.active=null;D.drafts={};TM=null;tick();
  DAY=nextDay();save();
  const idx=D.logs.length-1,cmp=compareSession(idx),prs=prsOf(idx);
  SHEET={type:'sum'};openSheet(sheetSummary(idx));
  if(prs.length||(cmp&&cmp.pct>0)){confetti();buzz([60,40,60]);}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  if(a==='tab')return go(v);
  if(a==='start'){DAY=v;return go('work');}
  if(a==='day'){DAY=v;return render();}
  if(a==='anim'||a==='tip'){const o=OPEN[id]=OPEN[id]||{};o[a==='anim'?'a':'t']=!o[a==='anim'?'a':'t'];return render();}
  if(a==='fill'){const ex=EXI[id],s=suggest(ex);if(s.first)return;const saved=(D.active&&D.active.entries[id])||[];if(!D.drafts[id])D.drafts[id]=[];
    for(let i=0;i<ex.sets;i++){if(saved.find(x=>x.i===i))continue;while(D.drafts[id].length<=i)D.drafts[id].push({w:'',r:''});D.drafts[id][i].w=String(s.w);}
    save();render();toast('وزنه‌ها پر شد؛ تعداد را خودت وارد کن');return;}
  if(a==='save')return saveSet(id,+b.dataset.i);
  if(a==='del'){if(!D.active)return;const i=+b.dataset.i;D.active.entries[id]=(D.active.entries[id]||[]).filter(x=>x.i!==i);if(!D.active.entries[id].length)delete D.active.entries[id];save();return render();}
  if(a==='rir')return setRir(+v);
  if(a==='sheetclose')return closeSheet();
  if(a==='note'){SHEET={type:'note'};return openSheet(sheetNote(id));}
  if(a==='tag'){if(!NOTE)return;NOTE.tags.has(v)?NOTE.tags.delete(v):NOTE.tags.add(v);b.classList.toggle('on');return;}
  if(a==='notesave'){if(!NOTE)return;const tx=(document.getElementById('notetx').value||'').trim();const A=ensureActive();
    if(NOTE.tags.size||tx)A.notes[NOTE.id]={tags:[...NOTE.tags],text:tx};else delete A.notes[NOTE.id];
    save();closeSheet();render();toast('یادداشت ذخیره شد');return;}
  if(a==='finish'){if(!D.active||!Object.keys(D.active.entries).length){toast('هنوز ستی ثبت نشده');return;}SHEET={type:'rpe'};return openSheet(sheetRpe());}
  if(a==='rpe'){closeSheet();return finish(+v);}
  if(a==='gohome'){closeSheet();return go('home');}
  if(a==='t15'){if(TM){TM.end+=15000;TM.dur+=15;TM.done=false;document.getElementById('timer').classList.remove('done');tick();}return;}
  if(a==='tskip'){TM=null;return tick();}
  if(a==='badge'){const bd=BADGES[+v];return toast(bd.n+': '+bd.d);}
  if(a==='hist'){HX[v]=!HX[v];return render();}
  if(a==='addw'){const g=k=>toEn(document.getElementById(k).value);
    if(!(+g('ww')>0)){toast('وزن را وارد کن');return;}
    D.weights.push({at:nowISO(),week:D.weights.length+1,weight:+g('ww'),waist:+g('wc')||null,energy:+g('we')||null,side:+g('ws')||null});
    save();toast('هفته ثبت شد');return render();}
  if(a==='delw'){if(confirm('آخرین هفته حذف شود؟')){D.weights.pop();save();render();}return;}
  if(a==='dell'){if(confirm('آخرین جلسه حذف شود؟')){D.logs.pop();HX={};save();render();}return;}
  if(a==='cpy'){const t=document.getElementById('exp');t.select();try{navigator.clipboard?navigator.clipboard.writeText(t.value).then(()=>toast('کپی شد'),()=>{document.execCommand('copy');toast('کپی شد');}):(document.execCommand('copy'),toast('کپی شد'));}catch(err){toast('متن را دستی انتخاب و کپی کن');}return;}
  if(a==='doimp'){try{const p=JSON.parse(document.getElementById('imp').value);if(!p||!Array.isArray(p.logs))throw 0;D=norm(p);save();toast('بازگردانده شد');render();}catch(err){toast('متن پشتیبان معتبر نیست');}return;}
});
['visibilitychange','pagehide'].forEach(ev=>{
  const h=()=>{clearTimeout(dt);save();};
  if(ev==='visibilitychange')document.addEventListener(ev,()=>{if(document.visibilityState==='hidden')h();});
  else window.addEventListener(ev,h);
});

/* ================= START ================= */
document.getElementById('navh').innerHTML=[['home','خانه','home'],['work','تمرین','dumb'],['prog','پیشرفت','chart'],['wt','وزن','scale'],['bk','پشتیبان','shield']]
  .map(x=>'<button data-act="tab" data-v="'+x[0]+'">'+IC[x[2]]+'<span>'+x[1]+'</span></button>').join('');
load().then(()=>{DAY=nextDay();render();}).catch(()=>render());
setInterval(()=>{if(D.active)save();},30000);

</script>
