<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر تمرین">
<meta name="theme-color" content="#15181E">
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2315181E'/%3E%3Ccircle cx='90' cy='90' r='58' fill='%23F5C518'/%3E%3Ccircle cx='90' cy='90' r='17' fill='%2315181E'/%3E%3C/svg%3E">
<title>دفتر تمرین</title>
<style>
:root{--bg:#15181E;--panel:#1D222B;--panel2:#232935;--line:#333B49;--ink:#EDF1F6;--mut:#8B95A6;--blue:#1276C4;--yellow:#F5C518;--red:#D8402F;--green:#00A05A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,'IRANSans',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.7;padding:16px 13px 96px}
.wrap{max-width:620px;margin:0 auto}
input,button,textarea{font-family:inherit}
.mono{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:21px;font-weight:800}
.eye{font-size:10px;letter-spacing:.16em;color:var(--mut);font-weight:700}
.meta{text-align:left;font-size:11px;color:var(--mut);line-height:1.8}

.chip{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:20px;border:1px solid}
.chip.on{color:#7FE3B4;border-color:rgba(0,160,90,.45);background:rgba(0,160,90,.1)}
.chip.off{color:#FF9A8F;border-color:rgba(216,64,47,.5);background:rgba(216,64,47,.12)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.pad{padding:13px 15px 14px}
.focus{border-right:3px solid var(--yellow)}

.banner{border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.9}
.banner.red{background:rgba(216,64,47,.12);border:1px solid var(--red)}
.banner.blue{background:rgba(18,118,196,.12);border:1px solid rgba(18,118,196,.4)}
.banner.green{background:rgba(0,160,90,.1);border:1px solid rgba(0,160,90,.35)}

.days{display:flex;gap:8px;margin-bottom:14px}
.days button{flex:1;padding:11px 4px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-weight:800;cursor:pointer}
.days button .l{font-size:18px;display:block}
.days button .s{font-size:10.5px;font-weight:500;margin-top:2px}
.days button.sel{color:#0E1116}
.days button:disabled{opacity:.32}

.exh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.exh strong{font-size:14.5px;font-weight:700}
.exh span{font-size:11px;color:var(--mut);white-space:nowrap}
.sug{margin-top:9px;padding:8px 11px;border-radius:6px;font-size:12px;background:rgba(139,149,166,.07);border:1px solid var(--line);color:#AFB9C7}
.sug.up{background:rgba(0,160,90,.1);border-color:rgba(0,160,90,.3);color:#5FD69E}
.sug b{color:var(--ink)}
.sug.up b{color:#7FE3B4}
.tipb{margin-top:8px;width:100%;text-align:right;background:none;border:1px solid var(--line);border-radius:6px;padding:7px 12px;color:var(--mut);font-size:12px;line-height:1.85;cursor:pointer}
.tipb.open{background:rgba(18,118,196,.08);border-color:rgba(18,118,196,.35);color:#BFD4E6;padding:10px 12px}

.sets{margin-top:11px;display:grid;gap:7px}
.row{display:grid;gap:7px;align-items:center}
.row .i{font-size:11px;color:var(--mut)}
.row input{background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:10px 4px;text-align:center;font-size:15px;outline:none;direction:ltr;width:100%}
.row input::placeholder{color:#5B6474}
.row .go{padding:10px 0;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:12px;font-weight:700;cursor:pointer}
.done{display:grid;grid-template-columns:24px 1fr auto auto;gap:7px;align-items:center;background:rgba(0,160,90,.07);border:1px solid rgba(0,160,90,.25);border-radius:6px;padding:8px 10px}
.done .v{font-size:13.5px;font-weight:700;direction:ltr;text-align:right}
.done .t{font-size:10.5px;color:var(--mut)}
.done .x{background:none;border:none;color:var(--mut);font-size:16px;cursor:pointer;padding:0 4px}

.big{width:100%;padding:15px;border-radius:8px;border:none;color:#0E1116;font-weight:800;font-size:15px;cursor:pointer}
.ghost{width:100%;padding:12px;border-radius:7px;background:none;border:1px solid var(--line);color:var(--mut);font-size:12.5px;cursor:pointer}
.note{font-size:11px;color:var(--mut);text-align:center;margin-top:9px;line-height:1.9}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label{font-size:11px;color:var(--mut);display:block;margin-bottom:5px}
.grid2 input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:10px;text-align:center;font-size:15px;outline:none;direction:ltr}

.wrow{display:flex;justify-content:space-between;padding:11px 16px;font-size:12.5px;border-bottom:1px solid #262D38}
.wrow:last-of-type{border-bottom:none}
.wrow b{font-weight:700;direction:ltr}

textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--mut);font-size:10.5px;padding:9px;direction:ltr;font-family:monospace;resize:vertical}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 0 16px;background:none;border:none;border-top:2px solid transparent;color:var(--mut);font-size:12px;cursor:pointer;margin-top:-1px}
nav button.sel{color:var(--ink);font-weight:700;border-top-color:var(--yellow)}

#toast{position:fixed;bottom:82px;right:50%;transform:translateX(50%);background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:9px 18px;font-size:12.5px;white-space:nowrap;z-index:30;display:none}
.sec{font-size:13px;font-weight:700;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="eye">فاز ۱ · شش هفته</div>
      <h1>دفتر تمرین</h1>
    </div>
    <div class="meta">
      <div id="mDate"></div>
      <div id="mCount"></div>
      <div style="margin-top:3px"><span id="mChip" class="chip on">…</span></div>
    </div>
  </div>
  <div id="banners"></div>
  <div id="view"></div>
</div>

<div id="toast"></div>

<nav>
  <button data-tab="w" class="sel">تمرین</button>
  <button data-tab="g">وزن هفتگی</button>
  <button data-tab="h">تاریخچه</button>
  <button data-tab="b">پشتیبان</button>
</nav>

<script>
/* ======================= PROGRAM ======================= */
const COL={A:'#1276C4',B:'#F5C518',C:'#D8402F'};
const PROGRAM={
A:{n:'پایین‌تنه + گریپ',ex:[
{id:'a1',n:'پرس پا دستگاه',sets:3,min:10,max:12,inc:5,tip:'پاها به عرض شانه، وسط صفحه. پایین آمدن را ۳ ثانیه کنترل کنید. کمر باید کاملاً به پشتی چسبیده بماند — لحظه‌ای که باسن از صندلی کنده شد، عمق را کم کنید. زانو را در بالا قفل نکنید.'},
{id:'a2',n:'جلو پا دستگاه',sets:3,min:12,max:15,inc:2.5,tip:'محور دستگاه باید دقیقاً هم‌راستای زانوی شما باشد؛ قبل از شروع تنظیمش کنید. در بالا یک ثانیه مکث و فشار. اگر بدن تکان می‌خورد، وزنه سنگین است.'},
{id:'a3',n:'پشت پا خوابیده',sets:3,min:12,max:15,inc:2.5,tip:'لگن را به تشک بچسبانید — بلند شدن باسن یعنی کمر دارد کار می‌کند نه پشت پا. برگشت را آهسته‌تر از رفت انجام دهید.'},
{id:'a4',n:'دستگاه ابداکشن (باز کردن پا)',sets:3,min:15,max:20,inc:5,tip:'پشت را کامل به پشتی بچسبانید و بالاتنه را تکان ندهید؛ حرکت فقط از لگن است. در انتهای باز شدن یک ثانیه فشار دهید و برگشت را آهسته کنترل کنید. عضله سرینی میانی در کسی که تمام روز نشسته تقریباً همیشه ضعیف است و ضعفش باعث می‌شود زانو در پرس پا به داخل بیفتد. اگر این دستگاه نبود، دستگاه گلوت (کیک‌بک) جایگزین کنید.'},
{id:'a5',n:'ساق پا دستگاه',sets:3,min:15,max:20,inc:5,tip:'دامنه کامل: در پایین کشش کامل، در بالا یک ثانیه اوج انقباض. نیم‌دامنه با وزنه سنگین اینجا کاملاً بی‌فایده است.'},
{id:'a6',n:'فارمرز واک',sets:3,min:30,max:40,inc:2.5,mode:'carry',focus:1,tip:'دمبل را با کمر صاف از زمین بردارید. شانه‌ها عقب و پایین، قفسه سینه باز، قدم‌های کوتاه و سریع. نفس را حبس نکنید.'},
{id:'a7',n:'جمع کردن مچ نشسته',sets:3,min:15,max:20,inc:2.5,focus:1,tip:'ساعد را روی ران بگذارید، فقط مچ حرکت کند. در پایین بگذارید هالتر تا نوک انگشتان بغلتد، بعد کامل جمع کنید — این نصف اثر حرکت است.'},
{id:'a8',n:'پلانک',sets:3,min:30,max:45,inc:5,mode:'time',tip:'باسن هم‌سطح شانه‌ها، شکم را به داخل جمع کنید، نفس عادی. لحظه‌ای که کمر افتاد ست تمام است.'}]},
B:{n:'بالاتنه کششی + ساعد',ex:[
{id:'b1',n:'زیربغل سیم‌کش از جلو',sets:4,min:10,max:12,inc:2.5,tip:'با آرنج بکشید، نه با دست. میله را تا بالای سینه بیاورید و کتف‌ها را پایین بکشید. عقب دادن بدن حداکثر ۱۵ درجه.'},
{id:'b2',n:'قایقی نشسته',sets:3,min:10,max:12,inc:2.5,tip:'سینه بالا و کمر صاف. در انتها کتف‌ها را یک ثانیه به هم فشار دهید. تاب دادن کمر ممنوع.'},
{id:'b3',n:'زیربغل تک‌دست دستگاه',sets:3,min:12,max:15,inc:2.5,tip:'دامنه کامل: در انتهای کشش بگذارید شانه کمی جلو بیاید تا زیربغل کاملاً کشیده شود، بعد بکشید.'},
{id:'b4',n:'فیس‌پول سیم‌کش',sets:3,min:15,max:20,inc:2.5,tip:'طناب را به سمت پیشانی بکشید، آرنج بالاتر از مچ. برای شانه کسی که تمام روز پشت میز است طلاست — وزنه سبک، فرم بی‌نقص.'},
{id:'b5',n:'جلو بازو معکوس EZ',sets:3,min:12,max:15,inc:2.5,focus:1,tip:'کف دست رو به پایین، مچ کاملاً صاف و قفل. وزنه سبک — هدف ساعد است نه بازو، و با وزنه سنگین مچ خم می‌شود و اثرش می‌پرد.'},
{id:'b6',n:'جلو بازو چکشی دمبل',sets:3,min:12,max:15,inc:2.5,focus:1,tip:'کف دست‌ها رو به هم، آرنج ثابت و چسبیده کنار بدن. تاب دادن شانه یعنی وزنه سنگین است.'},
{id:'b7',n:'باز کردن مچ معکوس',sets:3,min:15,max:20,inc:2.5,focus:1,tip:'ساعد روی ران، کف دست رو به پایین. دامنه کوچک است، پس وزنه خیلی سبک و اجرای آهسته.'}]},
C:{n:'بالاتنه فشاری + مچ',ex:[
{id:'c1',n:'پرس سینه دستگاه',sets:4,min:10,max:12,inc:2.5,tip:'ارتفاع صندلی را طوری تنظیم کنید که دسته‌ها هم‌سطح وسط سینه باشند. کتف‌ها عقب و پایین قفل. آرنج را کامل قفل نکنید.'},
{id:'c2',n:'پرس سرشانه دستگاه',sets:3,min:10,max:12,inc:2.5,tip:'کمر به پشتی، دنده‌ها را بالا ندهید. اگر گردن یا شانه درد گرفت، پایین‌تر از گوش نروید.'},
{id:'c3',n:'قفسه سینه (فلای)',sets:3,min:12,max:15,inc:2.5,tip:'آرنج نیمه‌خم و در تمام حرکت ثابت. حرکت از مفصل شانه است نه از آرنج. در انتها یک ثانیه فشار.'},
{id:'c4',n:'نشر جانب دمبل',sets:3,min:12,max:15,inc:2,tip:'دمبل سبک، فقط تا سطح شانه نه بالاتر. آرنج کمی جلوتر از خط بدن. انگار آب از بطری می‌ریزید.'},
{id:'c5',n:'پشت بازو سیم‌کش',sets:3,min:12,max:15,inc:2.5,tip:'آرنج چسبیده به پهلو و کاملاً ثابت؛ فقط ساعد حرکت می‌کند. اگر آرنج جلو و عقب می‌رود وزنه را کم کنید.'},
{id:'c6',n:'آویزان از بارفیکس',sets:3,min:20,max:40,inc:5,mode:'time',focus:1,tip:'شانه‌ها را فعال نگه دارید — شل نمانید، کمی کتف را پایین بکشید. با ۱۰ ثانیه شروع کنید و هر هفته ۵ ثانیه اضافه.'},
{id:'c7',n:'گریپر / فشار مچ',sets:3,min:15,max:20,inc:2.5,focus:1,tip:'تا بسته شدن کامل فشار دهید، بعد آهسته باز کنید. باز شدن کنترل‌شده مهم‌تر از فشردن است. هر دست جدا.'},
{id:'c8',n:'کرانچ دستگاه',sets:3,min:15,max:20,inc:2.5,tip:'با جمع کردن شکم حرکت کنید نه با کشیدن دست‌ها. در لحظه انقباض بازدم کامل.'}]}};

/* ======================= PWA MANIFEST ======================= */
try{
  const mf={name:'دفتر تمرین',short_name:'تمرین',start_url:'./',scope:'./',display:'standalone',
    background_color:'#15181E',theme_color:'#15181E',dir:'rtl',lang:'fa',
    icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%2315181E'/%3E%3Ccircle cx='256' cy='256' r='165' fill='%23F5C518'/%3E%3Ccircle cx='256' cy='256' r='48' fill='%2315181E'/%3E%3C/svg%3E",sizes:'512x512',type:'image/svg+xml',purpose:'any'}]};
  document.getElementById('mf').href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));
}catch(e){}

/* ======================= STORAGE (دو لایه) ======================= */
const K='gymlog-v1', K2='gymlog-v1-bk';
let LS_OK=false, IDB_OK=false;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t');LS_OK=true;}catch(e){}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

function idb(){return new Promise((res,rej)=>{
  if(!window.indexedDB)return rej();
  const r=indexedDB.open('gymdb',1);
  r.onupgradeneeded=()=>{try{r.result.createObjectStore('kv');}catch(e){}};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(); r.onblocked=()=>rej();
});}
function idbPut(v){return idb().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction('kv','readwrite');
  tx.objectStore('kv').put(v,'data');
  tx.oncomplete=()=>{IDB_OK=true;res(1);}; tx.onerror=()=>rej(); tx.onabort=()=>rej();
}));}
function idbGet(){return idb().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction('kv','readonly'), q=tx.objectStore('kv').get('data');
  q.onsuccess=()=>{IDB_OK=true;res(q.result||null);}; q.onerror=()=>rej();
}));}

let D={logs:[],weights:[],active:null,drafts:{}};
let lastSave=null;
const norm=p=>({logs:p.logs||[],weights:p.weights||[],active:p.active||null,drafts:p.drafts||{}});

async function load(){
  let raw=null;
  try{raw=await idbGet();}catch(e){}
  if(!raw&&LS_OK){try{raw=localStorage.getItem(K)||localStorage.getItem(K2);}catch(e){}}
  if(raw){try{D=norm(JSON.parse(raw));}catch(e){}}
}
function save(){
  const s=JSON.stringify(D);
  let ok=false;
  if(LS_OK){try{localStorage.setItem(K,s);localStorage.setItem(K2,s);ok=true;}catch(e){}}
  idbPut(s).then(()=>{if(!ok){lastSave=new Date();paintChip();}}).catch(()=>{});
  if(ok){lastSave=new Date();paintChip();return true;}
  if(IDB_OK){lastSave=new Date();paintChip();return true;}
  paintChip(true);return false;
}
const STORE_OK_FN=()=>LS_OK||IDB_OK;

/* ======================= HELPERS ======================= */
const fa=n=>(n===null||n===undefined||n==='')?'—':String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const nowISO=()=>new Date().toISOString();
const faD=i=>{try{return new Intl.DateTimeFormat('fa-IR').format(new Date(i));}catch(e){return String(i).slice(0,10);}};
const faT=i=>{try{return new Date(i).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TAB='w', DAY='A', OPENTIP=null;

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',1900);}

function lastLogOf(d){for(let i=D.logs.length-1;i>=0;i--)if(D.logs[i].day===d)return D.logs[i];return null;}

function suggest(ex,L){
  if(!L)return{first:1,msg:'اولین جلسه — وزنه‌ای بردارید که با فرم درست تا سقف تکرار برسید'};
  const s=(L.entries[ex.id]||[]).filter(x=>+x.r>0);
  if(!s.length)return{first:1,msg:'دفعه قبل ثبت نشده — از وزنه راحت شروع کنید'};
  const w=Math.max(...s.map(x=>+x.w||0)), r=s.map(x=>+x.r), full=s.length>=ex.sets;
  if(ex.mode==='time'){
    if(full&&r.every(x=>x>=ex.max))return{up:1,r:ex.max+ex.inc,msg:'همه ست‌ها کامل — '+fa(ex.inc)+' ثانیه اضافه کنید'};
    return{r:Math.max(...r),msg:'همین مدت را تکرار کنید تا کامل شود'};
  }
  if(full&&r.every(x=>x>=ex.max))return{up:1,w:w+ex.inc,r:ex.min,msg:'سقف تکرار زده شد — '+fa(ex.inc)+' کیلو اضافه'};
  if(r.some(x=>x<ex.min))return{w:w,r:ex.min,msg:'هنوز به کف بازه نرسیده‌اید — همین وزنه'};
  return{w:w,r:Math.min(...r)+1,msg:'وزنه ثابت، یک تکرار بیشتر بزنید'};
}

function analyze(){
  const L=D.weights; if(!L.length)return null;
  const c=L[L.length-1], p=L[L.length-2];
  if(!p)return{lv:'info',t:'نقطه شروع ثبت شد',m:'از هفته بعد نرخ تغییر محاسبه می‌شود.'};
  const d=+(p.weight-c.weight).toFixed(2);
  const l4=L.slice(-4), slow=l4.length===4&&l4.slice(1).every((x,i)=>l4[i].weight-x.weight<0.3);
  if(c.energy&&p.energy&&c.energy<5&&p.energy<5)return{lv:'warn',t:'دو هفته انرژی پایین',m:'یک هفته دیلود بگیرید: ست‌ها را نصف کنید و وزنه‌ها را ثابت نگه دارید. خواب ۶ ساعته هم‌زمان با کم‌خوری جواب نمی‌دهد.'};
  if(d>1.2)return{lv:'bad',t:fa(d)+' کیلو در هفته — خیلی سریع',m:'این نرخ یعنی بخش زیادی از کاهش، عضله است. کالری و پروتئین را بالا ببرید. هدف: ۱۶۰ تا ۱۸۰ گرم پروتئین روزانه.'};
  if(d>=0.5)return{lv:'good',t:fa(d)+' کیلو در هفته — ایده‌آل',m:'دقیقاً در بازه‌ای هستید که عضله حفظ می‌شود. تغییری ندهید.'};
  if(d>=0.3)return{lv:'good',t:fa(d)+' کیلو در هفته — آرام ولی درست',m:'روند سالم است. اگر دور کمر هم کم شده، عالی است.'};
  if(slow)return{lv:'warn',t:'سه هفته توقف',m:'قدم روزانه را به ۸۰۰۰ برسانید یا کالری شام را کم کنید. اول آب و خواب را چک کنید.'};
  if(d>=0)return{lv:'info',t:'تغییر ناچیز',m:'نوسان طبیعی است. اگر دور کمر کم شده، در حال عضله‌سازی هستید — بهترین حالت ممکن.'};
  return{lv:'warn',t:fa(Math.abs(d))+' کیلو افزایش',m:'اگر تازه کراتین شروع کرده‌اید، ۱ تا ۲ کیلو آب درون‌سلولی طبیعی است. اگر نه، شام و آخر هفته را بررسی کنید.'};
}

/* ======================= HEADER ======================= */
function paintChip(fail){
  const c=document.getElementById('mChip');
  if(!STORE_OK_FN()||fail){c.className='chip off';c.textContent='ذخیره‌سازی غیرفعال';}
  else{c.className='chip on';c.textContent=lastSave?('ذخیره شد '+faT(lastSave)):'ذخیره‌سازی فعال';}
  document.getElementById('mDate').textContent=faD(nowISO());
  document.getElementById('mCount').textContent=fa(D.logs.length)+' جلسه · هفته '+fa(D.weights.length);
}

function banners(){
  let h='';
  if(!STORE_OK_FN()){
    h+='<div class="banner red"><b>حافظه در دسترس نیست.</b><br>این صفحه را از یک آدرس اینترنتی (https) باز کنید، نه از داخل چت و نه از فایل روی گوشی. تا آن موقع از تب «پشتیبان» بعد از هر جلسه یک کپی بگیرید.</div>';
  }
  if(D.active){
    const n=Object.values(D.active.entries).reduce((a,x)=>a+x.length,0);
    h+='<div class="banner green"><b style="color:#7FE3B4">جلسه '+D.active.day+' باز است</b><br><span style="color:var(--mut);font-size:11px">'+faD(D.active.start)+' · شروع '+faT(D.active.start)+' · '+fa(n)+' ست ذخیره‌شده</span></div>';
  }
  document.getElementById('banners').innerHTML=h;
}

/* ======================= WORKOUT TAB ======================= */
function viewWorkout(){
  const P=PROGRAM[DAY], L=lastLogOf(DAY);
  let h='<div class="days">';
  for(const k of ['A','B','C']){
    const lock=D.active&&D.active.day!==k;
    h+='<button data-day="'+k+'" '+(lock?'disabled':'')+' class="'+(DAY===k?'sel':'')+'" style="'+(DAY===k?'background:'+COL[k]+';border-color:'+COL[k]:'')+'"><span class="l">'+k+'</span><span class="s">'+PROGRAM[k].n+'</span></button>';
  }
  h+='</div>';
  h+='<div style="font-size:11.5px;color:var(--mut);margin-bottom:12px">'+(L?('آخرین جلسه '+DAY+': '+faD(L.date)):'این جلسه هنوز ثبت نشده')+'</div>';

  P.ex.forEach(ex=>{
    const s=suggest(ex,L), saved=(D.active&&D.active.entries[ex.id])||[];
    const isT=ex.mode==='time', isC=ex.mode==='carry', op=OPENTIP===ex.id;
    h+='<div class="card '+(ex.focus?'focus':'')+'"><div class="pad">';
    h+='<div class="exh"><strong>'+esc(ex.n)+'</strong><span class="mono">'+ex.sets+' × '+ex.min+'–'+ex.max+(isT?'s':isC?'m':'')+'</span></div>';
    h+='<div class="sug '+(s.up?'up':'')+'">'+(s.first?esc(s.msg):('<b>'+(isT?(fa(s.r)+' ثانیه'):(fa(s.w)+' کیلو × '+fa(s.r)+(isC?' متر':'')))+'</b> — '+esc(s.msg)))+'</div>';
    h+='<button class="tipb '+(op?'open':'')+'" data-tip="'+ex.id+'">'+(op?esc(ex.tip):'نکات اجرای صحیح ▾')+'</button>';
    h+='<div class="sets">';
    for(let i=0;i<ex.sets;i++){
      const rec=saved.find(x=>x.i===i);
      if(rec){
        h+='<div class="done"><span style="font-size:11px;color:#5FD69E" class="mono">'+(i+1)+'</span><span class="v mono">'+(isT?(rec.r+'s'):(rec.w+' × '+rec.r+(isC?'m':'')))+'</span><span class="t">'+faT(rec.at)+'</span><button class="x" data-del="'+ex.id+'|'+i+'">×</button></div>';
      }else{
        const dv=(D.drafts[ex.id]&&D.drafts[ex.id][i])||{};
        h+='<div class="row" style="grid-template-columns:'+(isT?'24px 1fr 60px':'24px 1fr 1fr 60px')+'"><span class="i mono">'+(i+1)+'</span>';
        if(!isT)h+='<input inputmode="decimal" placeholder="کیلو" data-f="w" data-e="'+ex.id+'" data-i="'+i+'" value="'+(dv.w||'')+'">';
        h+='<input inputmode="decimal" placeholder="'+(isT?'ثانیه':isC?'متر':'تکرار')+'" data-f="r" data-e="'+ex.id+'" data-i="'+i+'" value="'+(dv.r||'')+'">';
        h+='<button class="go" data-set="'+ex.id+'|'+i+'">ثبت</button></div>';
      }
    }
    h+='</div></div></div>';
  });

  h+='<div class="card"><div class="pad"><div class="sec">هوازی — تردمیل شیب‌دار</div><input inputmode="decimal" placeholder="دقیقه" id="cardio" value="'+((D.active&&D.active.cardio)||'')+'" style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:10px;text-align:center;font-size:15px;outline:none;direction:ltr"></div></div>';
  h+='<button class="big" id="fin" style="background:'+COL[DAY]+';'+(D.active?'':'opacity:.35')+'">بستن جلسه '+DAY+'</button>';
  h+='<p class="note">هر ست با زدن «ثبت» فوراً روی حافظه گوشی نوشته می‌شود. عددهای نیمه‌نوشته هم خودکار نگه داشته می‌شوند.</p>';
  return h;
}

/* ======================= WEEK TAB ======================= */
function chartSVG(){
  const W=D.weights; if(W.length<2)return '';
  const ws=W.map(x=>x.weight), mn=Math.min(...ws)-1, mx=Math.max(...ws)+1;
  const w=560,hh=170,pad=8;
  const px=i=>pad+(i*(w-pad*2)/(W.length-1));
  const py=v=>hh-pad-((v-mn)/(mx-mn||1))*(hh-pad*2);
  let pts=W.map((x,i)=>px(i)+','+py(x.weight)).join(' ');
  let dots=W.map((x,i)=>'<circle cx="'+px(i)+'" cy="'+py(x.weight)+'" r="3.5" fill="#F5C518"/>').join('');
  let labs=W.map((x,i)=>'<text x="'+px(i)+'" y="'+(hh-1)+'" fill="#8B95A6" font-size="9" text-anchor="middle">'+x.week+'</text>').join('');
  return '<svg viewBox="0 0 '+w+' '+hh+'" width="100%" height="180" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="#F5C518" stroke-width="2.5" stroke-linejoin="round"/>'+dots+labs+'</svg>';
}
function viewWeek(){
  const a=analyze();
  const col={good:'#00A05A',bad:'#D8402F',warn:'#F5C518',info:'#8B95A6'};
  let h='';
  if(a)h+='<div class="card" style="border-right:3px solid '+col[a.lv]+'"><div class="pad"><div class="eye">تحلیل هفته گذشته</div><div style="font-size:16px;font-weight:800;color:'+col[a.lv]+';margin:6px 0 7px">'+esc(a.t)+'</div><p style="font-size:13px;color:#C3CBD6">'+esc(a.m)+'</p></div></div>';
  h+='<div class="card"><div class="pad"><div style="font-size:14px;font-weight:800">ثبت هفته '+fa(D.weights.length+1)+'</div><div style="font-size:11.5px;color:var(--mut);margin:4px 0 14px">صبح ناشتا، بعد از دستشویی، همان روز ثابت هفته</div><div class="grid2">'+
   '<div><label>وزن (کیلو)</label><input inputmode="decimal" id="ww"></div>'+
   '<div><label>دور کمر (سانتی‌متر)</label><input inputmode="decimal" id="wc"></div>'+
   '<div><label>انرژی ۱ تا ۱۰</label><input inputmode="decimal" id="we"></div>'+
   '<div><label>عوارض گوارشی ۱ تا ۱۰</label><input inputmode="decimal" id="ws"></div></div>'+
   '<button class="big" id="addw" style="background:#F5C518;margin-top:14px;padding:13px;font-size:14px">ثبت هفته</button></div></div>';
  if(D.weights.length>1)h+='<div class="card"><div class="pad"><div class="sec">روند وزن</div>'+chartSVG()+'</div></div>';
  if(D.weights.length){
    h+='<div class="card" style="padding:6px 0">';
    [...D.weights].reverse().forEach(x=>{h+='<div class="wrow"><span style="color:var(--mut)">هفته '+fa(x.week)+' · '+faD(x.at)+'</span><b class="mono">'+x.weight+' kg'+(x.waist?(' · '+x.waist+' cm'):'')+'</b></div>';});
    h+='<button class="ghost" id="delw" style="border:none;border-top:1px solid var(--line);border-radius:0">حذف آخرین هفته</button></div>';
  }
  return h;
}

/* ======================= HISTORY ======================= */
function viewHist(){
  if(!D.logs.length)return '<div class="card"><div class="pad" style="text-align:center;color:var(--mut);font-size:13px;padding:26px">هنوز جلسه‌ای بسته نشده.</div></div>';
  let h='';
  [...D.logs].reverse().forEach(l=>{
    const P=PROGRAM[l.day];
    let vol=0;Object.values(l.entries).forEach(a=>a.forEach(s=>vol+=(+s.w||0)*(+s.r||0)));
    h+='<div class="card" style="border-right:3px solid '+COL[l.day]+'"><div class="pad">';
    h+='<div class="exh"><strong>جلسه '+l.day+' — '+esc(P.n)+'</strong><span style="text-align:left">'+faD(l.date)+'<br>'+faT(l.start)+(l.end?(' تا '+faT(l.end)):'')+'</span></div>';
    h+='<div style="font-size:11.5px;color:var(--mut);margin-top:6px">حجم کل: <b style="color:var(--ink)" class="mono">'+Math.round(vol).toLocaleString('en')+'</b> کیلو'+(l.cardio?(' · هوازی '+fa(l.cardio)+' دقیقه'):'')+'</div>';
    h+='<div style="margin-top:9px;display:grid;gap:4px">';
    P.ex.filter(e=>l.entries[e.id]).forEach(e=>{
      h+='<div style="display:flex;justify-content:space-between;font-size:12px;color:#B9C2CE;gap:10px"><span>'+esc(e.n)+'</span><span class="mono" style="font-size:11.5px;white-space:nowrap">'+l.entries[e.id].map(s=>e.mode==='time'?(s.r+'s'):(s.w+'×'+s.r)).join('  ')+'</span></div>';
    });
    h+='</div></div></div>';
  });
  h+='<button class="ghost" id="dell">حذف آخرین جلسه</button>';
  return h;
}

/* ======================= BACKUP ======================= */
function viewBackup(){
  return '<div class="card"><div class="pad"><div class="sec">وضعیت ذخیره‌سازی</div>'+
  '<p style="font-size:12.5px;color:#C3CBD6">'+(STORE_OK_FN()?'حافظه فعال است. داده‌ها روی همین گوشی ذخیره می‌شوند و با بستن برنامه از بین نمی‌روند.':'<b style="color:#FF9A8F">حافظه در دسترس نیست.</b> این فایل را در مرورگر گوشی باز کنید، نه داخل چت.')+'</p>'+
  '<p style="font-size:12px;color:var(--mut);margin-top:10px">برای اینکه مثل یک اپ روی گوشی باز شود: در Safari دکمه اشتراک‌گذاری ← «Add to Home Screen». در Chrome منوی سه‌نقطه ← «افزودن به صفحه اصلی».</p></div></div>'+
  '<div class="card"><div class="pad"><div class="sec">گرفتن پشتیبان</div><p style="font-size:11.5px;color:var(--mut);margin-bottom:10px">این متن همه داده‌های شماست. هر چند هفته یک‌بار کپی کنید و در یادداشت‌های گوشی بگذارید.</p>'+
  '<textarea id="exp" readonly rows="5">'+esc(JSON.stringify(D))+'</textarea>'+
  '<button class="ghost" id="cpy" style="margin-top:9px">کپی کردن</button></div></div>'+
  '<div class="card"><div class="pad"><div class="sec">بازگرداندن پشتیبان</div><p style="font-size:11.5px;color:var(--mut);margin-bottom:10px">متن پشتیبان را اینجا بچسبانید. داده‌های فعلی جایگزین می‌شوند.</p>'+
  '<textarea id="imp" rows="4" placeholder="متن پشتیبان را اینجا بچسبانید"></textarea>'+
  '<button class="ghost" id="doimp" style="margin-top:9px">بازگرداندن</button></div></div>';
}

/* ======================= RENDER ======================= */
function render(){
  banners(); paintChip();
  const v=document.getElementById('view');
  v.innerHTML = TAB==='w'?viewWorkout():TAB==='g'?viewWeek():TAB==='h'?viewHist():viewBackup();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('sel',b.dataset.tab===TAB));
}

/* ======================= EVENTS ======================= */
let dt=null;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.e!==undefined){
    const id=t.dataset.e,i=+t.dataset.i,f=t.dataset.f;
    t.value=t.value.replace(/[^\d.]/g,'');
    if(!D.drafts[id])D.drafts[id]=[];
    while(D.drafts[id].length<=i)D.drafts[id].push({w:'',r:''});
    D.drafts[id][i][f]=t.value;
    clearTimeout(dt);dt=setTimeout(save,500);
  }
  if(t.id==='cardio'&&D.active){D.active.cardio=t.value;clearTimeout(dt);dt=setTimeout(save,500);}
});

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t)return;

  if(t.dataset.tab){TAB=t.dataset.tab;render();return;}
  if(t.dataset.day){DAY=t.dataset.day;OPENTIP=null;render();return;}
  if(t.dataset.tip){OPENTIP=OPENTIP===t.dataset.tip?null:t.dataset.tip;render();return;}

  if(t.dataset.set){
    const [id,i]=t.dataset.set.split('|'), idx=+i;
    const P=PROGRAM[DAY], ex=P.ex.find(x=>x.id===id);
    const dv=(D.drafts[id]&&D.drafts[id][idx])||{};
    if(!+dv.r){toast('مقدار ست را وارد کنید');return;}
    if(!D.active)D.active={id:Date.now(),day:DAY,start:nowISO(),entries:{},cardio:''};
    const arr=(D.active.entries[id]||[]).filter(x=>x.i!==idx);
    arr.push({w:+dv.w||0,r:+dv.r,at:nowISO(),i:idx});
    arr.sort((a,b)=>a.i-b.i);
    D.active.entries[id]=arr;
    if(D.drafts[id])D.drafts[id][idx]={w:'',r:''};
    toast(save()?('ست '+fa(idx+1)+' ذخیره شد'):'⚠ حافظه در دسترس نیست');
    render();return;
  }

  if(t.dataset.del){
    const [id,i]=t.dataset.del.split('|'), idx=+i;
    if(!D.active)return;
    D.active.entries[id]=(D.active.entries[id]||[]).filter(x=>x.i!==idx);
    if(!D.active.entries[id].length)delete D.active.entries[id];
    save();render();return;
  }

  if(t.id==='fin'){
    if(!D.active||!Object.keys(D.active.entries).length){toast('هنوز ستی ثبت نشده');return;}
    const c=document.getElementById('cardio');
    D.logs.push(Object.assign({},D.active,{end:nowISO(),date:D.active.start,cardio:c?c.value:''}));
    D.active=null;D.drafts={};
    DAY=['A','B','C'][(['A','B','C'].indexOf(DAY)+1)%3];
    save();toast('جلسه بسته شد');render();return;
  }

  if(t.id==='addw'){
    const g=i=>document.getElementById(i).value;
    if(!+g('ww')){toast('وزن را وارد کنید');return;}
    D.weights.push({at:nowISO(),week:D.weights.length+1,weight:+g('ww'),waist:+g('wc')||null,energy:+g('we')||null,side:+g('ws')||null});
    save();toast('هفته ثبت شد');render();return;
  }
  if(t.id==='delw'){D.weights.pop();save();render();return;}
  if(t.id==='dell'){D.logs.pop();save();render();return;}

  if(t.id==='cpy'){
    const a=document.getElementById('exp');a.select();
    try{document.execCommand('copy');toast('کپی شد');}catch(err){toast('دستی انتخاب و کپی کنید');}
    return;
  }
  if(t.id==='doimp'){
    try{
      const p=JSON.parse(document.getElementById('imp').value);
      D={logs:p.logs||[],weights:p.weights||[],active:p.active||null,drafts:p.drafts||{}};
      save();toast('بازگردانده شد');render();
    }catch(err){toast('متن پشتیبان معتبر نیست');}
    return;
  }
});

['visibilitychange','pagehide','blur'].forEach(ev=>{
  const h=()=>{clearTimeout(dt);save();};
  if(ev==='visibilitychange')document.addEventListener(ev,()=>{if(document.visibilityState==='hidden')h();});
  else window.addEventListener(ev,h);
});

render();
load().then(render).catch(render);
setInterval(()=>{if(D.active)save();},30000);
</script>
